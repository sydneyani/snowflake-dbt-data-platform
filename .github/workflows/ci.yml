name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --frozen --all-groups
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: Tests and dbt build
        env:
          DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
        run: uv run pytest
      - name: SQLFluff
        run: uv run sqlfluff lint transform/models transform/macros transform/snapshots transform/tests
