name: meridian
version: "1.0.0"
config-version: 2
profile: meridian

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

quoting:
  database: false
  schema: false
  identifier: false

seeds:
  meridian:
    +schema: reference
    known_header_gaps:
      +column_types:
        expected_residual: decimal(18, 2)

models:
  meridian:
    +materialized: view
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

snapshots:
  meridian:
    +target_schema: snapshots
